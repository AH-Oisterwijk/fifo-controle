name: One-shot static FIFO details migration

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/one-shot-static-details.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Patch FIFO Office Script lifecycle
        run: |
          echo '' | base64 -d > /tmp/patch_fifo.py
          python3 /tmp/patch_fifo.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fifo_shift_overdracht.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Keep FIFO details static after one-time setup'
          git push origin HEAD:beta
