name: Apply Panklaar product update

on:
  push:
    branches: [beta]
    paths:
      - ".github/workflows/apply-panklaar-update.yml"

permissions:
  contents: write

jobs:
  update-products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Replace Panklaar rows
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv

          products = Path("data/products.csv")
          snapshot = Path("tools/panklaar_update_snapshot.csv")
          headers = ["Nasa","Productnaam","Afdeling","Subafdeling","Actief","Gewicht","Kans14"]

          with products.open("r", encoding="utf-8-sig", newline="") as f:
              current = list(csv.DictReader(f, delimiter=";"))

          with snapshot.open("r", encoding="utf-8-sig", newline="") as f:
              panklaar = list(csv.DictReader(f, delimiter=";"))

          if len(panklaar) != 272:
              raise SystemExit(f"Expected 272 Panklaar rows, got {len(panklaar)}")

          kept = [
              row for row in current
              if row.get("Afdeling") != "Panklaar" and row.get("Subafdeling") != "Panklaar"
          ]

          existing = {row.get("Nasa", "") for row in kept}
          overlap = sorted(existing & {row.get("Nasa", "") for row in panklaar})
          if overlap:
              raise SystemExit(f"NASA overlap with other departments: {overlap[:20]}")

          combined = kept + panklaar

          with products.open("w", encoding="utf-8", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=headers, delimiter=";", lineterminator="\n")
              writer.writeheader()
              writer.writerows({h: row.get(h, "") for h in headers} for row in combined)

          if len(kept) != 1753 or len(combined) != 2025:
              raise SystemExit(f"Unexpected counts: kept={len(kept)} total={len(combined)}")

          print(f"Updated products.csv: {len(kept)} non-Panklaar + {len(panklaar)} Panklaar = {len(combined)}")
          PY

      - name: Commit updated products.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.csv
          git diff --cached --quiet && exit 0
          git commit -m "Replace Panklaar products from latest Kookgemak data"
          git push origin HEAD:beta
