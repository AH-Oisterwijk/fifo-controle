name: One-shot dynamic FIFO Excel migration

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/one-shot-dynamic-fifo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Patch dynamic Excel dashboard
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('fifo_shift_overdracht.ts')
          text = path.read_text(encoding='utf-8')

          def once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return source.replace(old, new, 1)

          text = once(
              text,
              'const ALLOW_WORKBOOK_SETUP = true;\n',
              'const ALLOW_WORKBOOK_SETUP = true;\nconst DASHBOARD_DETAIL_FIRST_ROW = 9;\nconst DASHBOARD_MIN_DETAIL_ROWS = 7;\n',
              'constants'
          )

          text = once(
              text,
              'function runDashboardSetup(workbook: ExcelScript.Workbook, password: string): void {\n  resetDetailSheetsForSetup(workbook, password);',
              'function runDashboardSetup(workbook: ExcelScript.Workbook, password: string): void {\n  const existingDataSheet = workbook.getWorksheet(DATA_SHEET_NAME);\n  const storedHistoryRowsBefore = existingDataSheet ? countStoredHistoryRows(existingDataSheet) : 0;\n\n  resetDetailSheetsForSetup(workbook, password);',
              'setup precheck'
          )

          start = text.index('function runDashboardSetup(')
          end = text.index('\nfunction parseControleData(', start)
          block = text[start:end]
          block = once(
              block,
              '    const dataSheet = getRequiredWorksheet(workbook, DATA_SHEET_NAME);\n    dataSheet.setVisibility(ExcelScript.SheetVisibility.visible);\n',
              '    const dataSheet = getRequiredWorksheet(workbook, DATA_SHEET_NAME);\n    dataSheet.setVisibility(ExcelScript.SheetVisibility.visible);\n\n    const storedHistoryRowsAfterReset = countStoredHistoryRows(dataSheet);\n    if (storedHistoryRowsAfterReset < storedHistoryRowsBefore) {\n      throw new Error(`Setup afgebroken: FIFO Controle Data bevat na de dashboard-reset minder historische regels (${storedHistoryRowsAfterReset}) dan ervoor (${storedHistoryRowsBefore}).`);\n    }\n',
              'reset guard'
          )
          block = once(
              block,
              '    ensureHistoryHeader(dataSheet);\n    refreshAvailableLists(dataSheet);\n',
              '    ensureHistoryHeader(dataSheet);\n    refreshAvailableLists(dataSheet);\n\n    const storedHistoryRowsAfterRefresh = countStoredHistoryRows(dataSheet);\n    if (storedHistoryRowsAfterRefresh < storedHistoryRowsBefore) {\n      throw new Error(`Setup afgebroken: FIFO Controle Data verloor tijdens het vernieuwen historische regels (${storedHistoryRowsAfterRefresh}/${storedHistoryRowsBefore}).`);\n    }\n',
              'refresh guard'
          )
          block = once(
              block,
              '      buildDashboardSheet(dashboardSheet, getLatestDateDisplay(dataSheet), getLatestWeekDisplay(dataSheet));',
              '      buildDashboardSheet(\n        dashboardSheet,\n        getLatestDateDisplay(dataSheet),\n        getLatestWeekDisplay(dataSheet),\n        getDashboardDetailRowCount(dataSheet),\n        getDashboardDataLastRow(dataSheet)\n      );',
              'setup dashboard call'
          )
          text = text[:start] + block + text[end:]

          text = once(
              text,
              '      buildDashboardSheet(dashboardSheet, analyse.DatumKey, getWeekDisplayForDateKey(analyse.DatumKey));',
              '      buildDashboardSheet(\n        dashboardSheet,\n        analyse.DatumKey,\n        getWeekDisplayForDateKey(analyse.DatumKey),\n        getDashboardDetailRowCount(dataSheet),\n        getDashboardDataLastRow(dataSheet)\n      );',
              'fifo dashboard call'
          )
          text = once(
              text,
              '      buildDashboardSheet(dashboardSheet, dateKey, getWeekDisplayForDateKey(dateKey));',
              '      buildDashboardSheet(\n        dashboardSheet,\n        dateKey,\n        getWeekDisplayForDateKey(dateKey),\n        getDashboardDetailRowCount(dataSheet),\n        getDashboardDataLastRow(dataSheet)\n      );',
              'missing dashboard call'
          )

          text = once(
              text,
              'function buildDashboardSheet(\n  sheet: ExcelScript.Worksheet,\n  selectedDateKey: string,\n  selectedWeekDisplay: string\n): void {\n  const canvas = sheet.getRange("A1:Q80");',
              'function buildDashboardSheet(\n  sheet: ExcelScript.Worksheet,\n  selectedDateKey: string,\n  selectedWeekDisplay: string,\n  detailRowCount: number = DASHBOARD_MIN_DETAIL_ROWS,\n  dataLastRow: number = 2\n): void {\n  const safeDetailRows = Math.max(DASHBOARD_MIN_DETAIL_ROWS, Math.floor(detailRowCount || 0));\n  const detailEndRow = DASHBOARD_DETAIL_FIRST_ROW + safeDetailRows - 1;\n  const canvasLastRow = Math.max(60, detailEndRow + 4);\n  const safeDataLastRow = Math.max(2, Math.floor(dataLastRow || 2));\n  const canvas = sheet.getRange(`A1:Q${canvasLastRow}`);',
              'dashboard signature'
          )

          start = text.index('function buildDashboardSheet(')
          end = text.index('\nfunction detailRowsForDashboard(', start)
          block = text[start:end]
          block = block.replace('$5000', '$${safeDataLastRow}')
          pairs = [
              ('sheet.getRange("A5:E35").setNumberFormatLocal("General");', 'sheet.getRange(`A5:E${detailEndRow}`).setNumberFormatLocal("General");'),
              ('sheet.getRange("A9:F35").clear(ExcelScript.ClearApplyTo.contents);', 'sheet.getRange(`A${DASHBOARD_DETAIL_FIRST_ROW}:F${detailEndRow}`).clear(ExcelScript.ClearApplyTo.contents);'),
              ('sheet.getRange("A9:F35").setNumberFormatLocal("General");', 'sheet.getRange(`A${DASHBOARD_DETAIL_FIRST_ROW}:F${detailEndRow}`).setNumberFormatLocal("General");'),
              ('sheet.getRange("A9:F35").getFormat().getFill().setColor("#FFFFFF");', 'sheet.getRange(`A${DASHBOARD_DETAIL_FIRST_ROW}:F${detailEndRow}`).getFormat().getFill().setColor("#FFFFFF");'),
              ('setThinBorders(sheet.getRange("A8:E35"));', 'setThinBorders(sheet.getRange(`A8:E${detailEndRow}`));'),
              ('for (let row = 8; row <= 34; row++) {\n    writeDayProductRow(sheet, row);\n  }', 'for (let row = DASHBOARD_DETAIL_FIRST_ROW - 1; row < detailEndRow; row++) {\n    writeDayProductRow(sheet, row, safeDataLastRow);\n  }'),
              ('sheet.getRange("I1:I60").getFormat().getFill().setColor("#404040");', 'sheet.getRange(`I1:I${canvasLastRow}`).getFormat().getFill().setColor("#404040");'),
              ('writeWeekDagRow(sheet, 8 + i, dagen[i]);', 'writeWeekDagRow(sheet, 8 + i, dagen[i], safeDataLastRow);'),
              ('sheet.getRange("A8:N35").getFormat().setRowHeight(18);', 'sheet.getRange(`A8:N${detailEndRow}`).getFormat().setRowHeight(18);'),
              ('sheet.getRange("A1:Q60").getFormat().getProtection().setLocked(true);', 'sheet.getRange(`A1:Q${canvasLastRow}`).getFormat().getProtection().setLocked(true);')
          ]
          for old, new in pairs:
              block = once(block, old, new, old[:28])
          text = text[:start] + block + text[end:]

          helpers = '''function countStoredHistoryRows(sheet: ExcelScript.Worksheet): number {\n  const used = sheet.getUsedRange();\n  const rowCount = used ? used.getRowCount() : 0;\n  if (rowCount <= 1) return 0;\n\n  const values = sheet.getRangeByIndexes(1, 0, rowCount - 1, 16).getValues();\n  let count = 0;\n  for (const row of values) {\n    if (row.some(value => String(value ?? "").trim() !== "")) count++;\n  }\n  return count;\n}\n\nfunction getDashboardDataLastRow(sheet: ExcelScript.Worksheet): number {\n  const used = sheet.getUsedRange();\n  const rowCount = used ? used.getRowCount() : 0;\n  if (rowCount <= 1) return 2;\n\n  const values = sheet.getRangeByIndexes(1, 0, rowCount - 1, 16).getValues();\n  for (let row = values.length - 1; row >= 0; row--) {\n    if (values[row].some(value => String(value ?? "").trim() !== "")) return row + 2;\n  }\n  return 2;\n}\n\nfunction getDashboardDetailRowCount(sheet: ExcelScript.Worksheet): number {\n  const dataLastRow = getDashboardDataLastRow(sheet);\n  const values = sheet.getRangeByIndexes(1, 0, Math.max(dataLastRow - 1, 1), 16).getValues();\n  const runCounts: { [key: string]: number } = {};\n  let maxRows = 0;\n\n  for (const row of values) {\n    if (normalize(String(row[6] ?? "")) !== normalize("FIFO")) continue;\n    const runTimestamp = String(row[15] ?? "").trim();\n    const dateKey = String(row[1] ?? "").trim();\n    const runDisplay = String(row[0] ?? "").trim();\n    const key = runTimestamp ? `timestamp:${runTimestamp}` : `legacy:${dateKey}|${runDisplay}`;\n    runCounts[key] = (runCounts[key] || 0) + 1;\n    maxRows = Math.max(maxRows, runCounts[key]);\n  }\n\n  return Math.max(DASHBOARD_MIN_DETAIL_ROWS, maxRows);\n}\n\n'''
          text = once(text, 'function historyHeaders(): string[] {', helpers + 'function historyHeaders(): string[] {', 'helpers')

          start = text.index('function writeDirectDayDetail(')
          end = text.index('\nfunction writeDepartmentSummaryRow(', start)
          block = text[start:end]
          block = once(
              block,
              '  const clearRange = sheet.getRange("A9:E35");',
              '  const directDetailRows = Math.max(\n    DASHBOARD_MIN_DETAIL_ROWS,\n    analyse.Details.length + analyse.Samenvatting.length + 2\n  );\n  const directEndRow = DASHBOARD_DETAIL_FIRST_ROW + directDetailRows - 1;\n  const clearRange = sheet.getRange(`A${DASHBOARD_DETAIL_FIRST_ROW}:E${directEndRow}`);',
              'direct detail range'
          )
          text = text[:start] + block + text[end:]

          start = text.index('function writeDayProductRow(')
          end = text.index('\nfunction writeWeekDagRow(', start)
          block = text[start:end]
          block = once(block, 'function writeDayProductRow(sheet: ExcelScript.Worksheet, zeroBasedRow: number): void {', 'function writeDayProductRow(sheet: ExcelScript.Worksheet, zeroBasedRow: number, dataLastRow: number): void {', 'day signature')
          block = block.replace('$5000', '$${dataLastRow}')
          text = text[:start] + block + text[end:]

          start = text.index('function writeWeekDagRow(')
          end = text.index('\nfunction formatDateDisplay(', start)
          block = text[start:end]
          block = once(block, 'function writeWeekDagRow(sheet: ExcelScript.Worksheet, zeroBasedRow: number, dagNaam: string): void {', 'function writeWeekDagRow(sheet: ExcelScript.Worksheet, zeroBasedRow: number, dagNaam: string, dataLastRow: number): void {', 'week signature')
          block = block.replace('$5000', '$${dataLastRow}')
          text = text[:start] + block + text[end:]

          if 'deleteWorksheetIfExists(workbook, DATA_SHEET_NAME' in text:
              raise SystemExit('Unsafe setup: data sheet deletion detected')
          for forbidden in ['A9:E35', 'A9:F35', 'A8:E35', 'row <= 34', '$5000']:
              if forbidden in text:
                  raise SystemExit(f'Old fixed limit still present: {forbidden}')

          path.write_text(text, encoding='utf-8')
          PY

          grep -q 'getDashboardDetailRowCount(dataSheet)' fifo_shift_overdracht.ts
          grep -q 'storedHistoryRowsBefore' fifo_shift_overdracht.ts
          ! grep -q 'A9:F35' fifo_shift_overdracht.ts
          ! grep -q '\$5000' fifo_shift_overdracht.ts

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fifo_shift_overdracht.ts
          git commit -m 'Make FIFO Excel dashboard dynamic and setup data-safe'
          git push origin HEAD:beta
