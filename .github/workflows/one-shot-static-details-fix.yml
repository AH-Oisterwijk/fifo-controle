name: Retry static FIFO details migration

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/one-shot-static-details-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Reuse validated patch script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          workflow = Path('.github/workflows/one-shot-static-details.yml').read_text(encoding='utf-8')
          match = re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d", workflow)
          if not match:
              raise SystemExit('embedded patch script not found')
          script = base64.b64decode(match.group(1)).decode('utf-8')
          script = script.replace("if text.count('buildDashboardSheet(') != 2:", "if text.count('buildDashboardSheet(') != 3:")
          script = script.replace('expected only setup/buildSetupDashboard calls', 'expected definition plus setup/buildSetupDashboard calls')
          Path('/tmp/patch_fifo.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/patch_fifo.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fifo_shift_overdracht.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Keep FIFO details static after one-time setup'
          git push origin HEAD:beta
