name: Patch beta pager
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/patch-beta-pager.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
      - name: Patch pager
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/pager.js'); t=p.read_text()
          t=t.replace("const FIFO_FLOW_SCHEMA = 2;\n","const FIFO_FLOW_SCHEMA = 2;\nconst FIFO_MAX_PRODUCTS = 28;\nconst FIFO_MAX_PER_GROUP = 6;\n",1)
          t=t.replace("  if(fifoFlow.useStandardCounts){\n    fifoFlow.counts = fifoMinimumCounts();\n  }\n}\n","}\n",1)
          old="""function fifoMaxForGroup(groupKey){
  const rule = subCounts.find(item => norm(item.subafdeling) === norm(groupKey));
  return Math.max(rule ? rule.count : 1, productsForSelectionGroup(groupKey).length);
}
"""
          new="""function fifoMaxForGroup(groupKey){
  const rule = subCounts.find(item => norm(item.subafdeling) === norm(groupKey));
  const minimum = rule ? rule.count : 1;
  const poolSize = productsForSelectionGroup(groupKey).length;
  return Math.max(minimum, Math.min(poolSize, Math.min(FIFO_MAX_PER_GROUP, minimum + 3)));
}

function fifoConfiguredTotal(){
  return subCounts.reduce((sum, rule) => {
    if(fifoFlow.pendingNotFilled[rule.subafdeling]) return sum;
    const count = fifoFlow.useStandardCounts ? rule.count : Math.max(rule.count, Number(fifoFlow.counts[rule.subafdeling]) || rule.count);
    return sum + count;
  }, 0);
}
"""
          assert old in t; t=t.replace(old,new,1)
          t=t.replace("  const standardChecked = fifoFlow.useStandardCounts ? 'checked' : '';\n  const rows = subCounts.map(rule => {","  const standardChecked = fifoFlow.useStandardCounts ? 'checked' : '';\n  const configuredTotal = fifoConfiguredTotal();\n  const rows = subCounts.map(rule => {",1)
          t=t.replace("${countDisabled || count >= max ? 'disabled' : ''}>+</button>","${countDisabled || count >= max || configuredTotal >= FIFO_MAX_PRODUCTS ? 'disabled' : ''}>+</button>",1)
          t=t.replace("<small>Uitvinken om per subafdeling extra producten toe te voegen.</small>","<small>Uitvinken om per subafdeling extra producten toe te voegen. ${configuredTotal}/${FIFO_MAX_PRODUCTS} geselecteerd.</small>",1)
          old="""function fifoHandleStandardToggle(e){
  fifoFlow.useStandardCounts = !!e.currentTarget.checked;
  if(fifoFlow.useStandardCounts){
    fifoFlow.counts = fifoMinimumCounts();
  }
  fifoSaveFlowState();
  fifoRenderSetup();
}
"""
          new="""function fifoHandleStandardToggle(e){
  fifoFlow.useStandardCounts = !!e.currentTarget.checked;
  fifoSaveFlowState();
  fifoRenderSetup();
}
"""
          assert old in t; t=t.replace(old,new,1)
          t=t.replace("  if(e.currentTarget.dataset.action === 'plus') count++;","  if(e.currentTarget.dataset.action === 'plus'){\n    if(fifoConfiguredTotal() >= FIFO_MAX_PRODUCTS) return;\n    count++;\n  }",1)
          t=t.replace("  const removedCompleted = fifoCountCompletedThatWouldBeLost();","  const configuredTotal = fifoConfiguredTotal();\n  if(configuredTotal > FIFO_MAX_PRODUCTS){ alert(`Kies maximaal ${FIFO_MAX_PRODUCTS} producten per controle.`); return; }\n\n  const removedCompleted = fifoCountCompletedThatWouldBeLost();",1)
          t=t.replace("  if(fifoFlow.useStandardCounts){\n    fifoFlow.counts = fifoMinimumCounts();\n  }\n\n  if(!fifoReconcileSelectionToSettings()) return;","  if(!fifoReconcileSelectionToSettings()) return;",1)
          old="    const desired = fifoFlow.useStandardCounts ? rule.count : Math.max(rule.count, Number(fifoFlow.counts[groupKey]) || rule.count);\n    let groupItems = fifoSelectionItemsForGroup(groupKey);"
          new="    const desired = fifoFlow.pendingNotFilled[groupKey] ? 0 : (fifoFlow.useStandardCounts ? rule.count : Math.max(rule.count, Number(fifoFlow.counts[groupKey]) || rule.count));\n    let groupItems = fifoSelectionItemsForGroup(groupKey);"
          assert old in t; t=t.replace(old,new,1)
          t=t.replace("  if(fifoFlow.useStandardCounts){\n    fifoFlow.counts = fifoMinimumCounts();\n  }\n\n  if(!fifoReconcileSelectionToSettings()) return;","  if(!fifoReconcileSelectionToSettings()) return;",1)
          assert 'FIFO_MAX_PRODUCTS = 28' in t and 'fifoConfiguredTotal' in t
          p.write_text(t)
          Path('.github/workflows/patch-beta-pager.yml').unlink()
          PY
          node --check js/pager.js
      - name: Commit
        run: |
          git config user.name AH-Oisterwijk
          git config user.email Bob.Schegget@ah.nl
          git add js/pager.js .github/workflows/patch-beta-pager.yml
          git commit -m 'Limit configurable beta control to safe product counts'
          git push origin beta
