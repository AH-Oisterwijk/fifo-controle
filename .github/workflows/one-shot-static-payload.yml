name: One-shot static payload migration
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/one-shot-static-payload.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Remove duplicate warning data from payload
        shell: bash
        run: echo '' | base64 -d > /tmp/patch.py && python3 /tmp/patch.py && git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add js/forms.js fifo_shift_overdracht.ts && (git diff --cached --quiet || (git commit -m 'Use static product cap with compact warning payload' && git push origin HEAD:beta))
