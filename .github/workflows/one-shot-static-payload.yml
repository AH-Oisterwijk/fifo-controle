name: One-shot static payload migration
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/one-shot-static-payload.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Remove duplicate warning data from payload
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          forms_path = Path('js/forms.js')
          forms = forms_path.read_text(encoding='utf-8')

          pattern = re.compile(r'function buildFormsRecord\(record\)\{.*?\n\}\n\nfunction formatProductLine', re.S)
          replacement = '''function buildFormsRecord(record){
  const productRows = (record.Producten || []).map(p => [
    encodeAfdelingCode(p.Afdeling),
    p.Nasa || '',
    encodeStatusCode(p.Status, !!p.AfdelingNietGevuld)
  ]);

  const compact = {
    v: 4,
    d: record.DagKey,
    dt: record.DatumTijd,
    s: record.Shiftleider,
    ng: (record.AfdelingenNietGevuld || []).map(encodeAfdelingCode),
    p: productRows,
    // Medewerker + volledige producttekst staan alleen hier; geen dubbele medewerkernaam meer in p.
    w: (record.Waarschuwingen || []).map(w => [
      w.NaamMedewerker || '',
      w.Opmerkingen || ''
    ])
  };

  if(!productRows.length){
    compact.sc = compactScores(record.Scores);
  }

  return compact;
}

function formatProductLine'''
          forms, count = pattern.subn(replacement, forms, count=1)
          if count != 1:
              raise SystemExit(f'forms buildFormsRecord: expected 1 match, found {count}')
          if 'v: 4' not in forms or 'w.NaamMedewerker' not in forms:
              raise SystemExit('v4 Forms payload validation failed')
          forms_path.write_text(forms, encoding='utf-8')

          ts_path = Path('fifo_shift_overdracht.ts')
          ts = ts_path.read_text(encoding='utf-8')

          old = '''  if (payload.w) {
    for (const row of payload.w) {
      const naamMedewerker = String(row[1] ?? "").trim();

      if (!naamMedewerker) {
        continue;
      }

      waarschuwingen.push({
        DatumGegeven: String(row[0] ?? payload.d ?? "").trim(),
        NaamMedewerker: naamMedewerker,
        Reden: "Niet FIFO",
        Officieel: "Nee",
        ShiftleiderManager: String(row[2] ?? payload.s ?? "").trim(),
        Opmerkingen: String(row[3] ?? "").trim()
      });
    }
  }
'''
          new = '''  if (payload.w) {
    const compactVersion = Number(payload.v || 0);

    for (const row of payload.w) {
      const naamMedewerker = compactVersion >= 4
        ? String(row[0] ?? "").trim()
        : String(row[1] ?? "").trim();

      if (!naamMedewerker) {
        continue;
      }

      waarschuwingen.push({
        DatumGegeven: compactVersion >= 4
          ? String(payload.d ?? "").trim()
          : String(row[0] ?? payload.d ?? "").trim(),
        NaamMedewerker: naamMedewerker,
        Reden: "Niet FIFO",
        Officieel: "Nee",
        ShiftleiderManager: compactVersion >= 4
          ? String(payload.s ?? "").trim()
          : String(row[2] ?? payload.s ?? "").trim(),
        Opmerkingen: compactVersion >= 4
          ? String(row[1] ?? "").trim()
          : String(row[3] ?? "").trim()
      });
    }

    // In v4 wordt de medewerkernaam niet dubbel per product verstuurd. Koppel hem terug via NASA
    // uit de waarschuwingstekst, zodat 'Fout door ...' in FIFO Controle Details intact blijft.
    if (compactVersion >= 4 && waarschuwingen.length > 0) {
      for (const product of producten) {
        if (String(product.MedewerkerNaam || "").trim() !== "") continue;
        if (normalize(String(product.Status || "")) !== normalize("Fout")) continue;

        const nasa = String(product.Nasa || "").trim();
        if (!nasa) continue;
        const marker = `(${nasa})`;
        const warning = waarschuwingen.find(item => String(item.Opmerkingen || "").indexOf(marker) >= 0);
        if (warning) product.MedewerkerNaam = warning.NaamMedewerker || "";
      }
    }
  }
'''
          if ts.count(old) != 1:
              raise SystemExit(f'Office Script warning block: expected 1 match, found {ts.count(old)}')
          ts = ts.replace(old, new, 1)
          if 'compactVersion >= 4' not in ts or 'const marker = `(${nasa})`;' not in ts:
              raise SystemExit('Office Script v4 validation failed')
          ts_path.write_text(ts, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/forms.js fifo_shift_overdracht.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Use static product cap with compact warning payload'
          git push origin HEAD:beta
