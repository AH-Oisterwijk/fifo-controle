name: Apply beta configurable flow v4

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/apply-beta-configurable-flow-v4.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Patch beta web flow and Excel parser
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

