              1
          )

          old = """  if(fifoFlow.useStandardCounts){
    fifoFlow.counts = fifoMinimumCounts();
  }
}
"""
          if old not in text:
              raise SystemExit('pager: standaard-reset bij laden niet gevonden')
          text = text.replace(old, "}\n", 1)

          old = """function fifoMaxForGroup(groupKey){
  const rule = subCounts.find(item => norm(item.subafdeling) === norm(groupKey));
  return Math.max(rule ? rule.count : 1, productsForSelectionGroup(groupKey).length);
}
"""
          new = """function fifoMaxForGroup(groupKey){
  const rule = subCounts.find(item => norm(item.subafdeling) === norm(groupKey));
  const minimum = rule ? rule.count : 1;
  const poolSize = productsForSelectionGroup(groupKey).length;
  return Math.max(minimum, Math.min(poolSize, Math.min(FIFO_MAX_PER_GROUP, minimum + 3)));
}

function fifoConfiguredTotal(){
  return subCounts.reduce((sum, rule) => {
    if(fifoFlow.pendingNotFilled[rule.subafdeling]) return sum;
    const count = fifoFlow.useStandardCounts
      ? rule.count
      : Math.max(rule.count, Number(fifoFlow.counts[rule.subafdeling]) || rule.count);
    return sum + count;
  }, 0);
}
"""
          if old not in text:
              raise SystemExit('pager: fifoMaxForGroup niet gevonden')
          text = text.replace(old, new, 1)

          old = """  const minimums = fifoMinimumCounts();
  const standardChecked = fifoFlow.useStandardCounts ? 'checked' : '';
  const rows = subCounts.map(rule => {
"""
          new = """  const minimums = fifoMinimumCounts();
  const standardChecked = fifoFlow.useStandardCounts ? 'checked' : '';
  const configuredTotal = fifoConfiguredTotal();
  const rows = subCounts.map(rule => {
"""
          if old not in text:
              raise SystemExit('pager: setup total invoegpunt niet gevonden')
          text = text.replace(old, new, 1)

          old = """        <button type=\"button\" class=\"fifo-count-btn\" data-action=\"plus\" data-group=\"${esc(groupKey)}\" ${countDisabled || count >= max ? 'disabled' : ''}>+</button>
"""
          new = """        <button type=\"button\" class=\"fifo-count-btn\" data-action=\"plus\" data-group=\"${esc(groupKey)}\" ${countDisabled || count >= max || configuredTotal >= FIFO_MAX_PRODUCTS ? 'disabled' : ''}>+</button>
"""
          if old not in text:
              raise SystemExit('pager: plusknop niet gevonden')
          text = text.replace(old, new, 1)

          old = """          <small>Uitvinken om per subafdeling extra producten toe te voegen.</small>
"""
          new = """          <small>Uitvinken om per subafdeling extra producten toe te voegen. ${configuredTotal}/${FIFO_MAX_PRODUCTS} geselecteerd.</small>
"""
          if old not in text:
              raise SystemExit('pager: standaardtekst niet gevonden')
          text = text.replace(old, new, 1)

          old = """function fifoHandleStandardToggle(e){
  fifoFlow.useStandardCounts = !!e.currentTarget.checked;
  if(fifoFlow.useStandardCounts){
    fifoFlow.counts = fifoMinimumCounts();
  }
  fifoSaveFlowState();
  fifoRenderSetup();
}
"""
          new = """function fifoHandleStandardToggle(e){
  fifoFlow.useStandardCounts = !!e.currentTarget.checked;
  fifoSaveFlowState();
  fifoRenderSetup();
}
"""
          if old not in text:
              raise SystemExit('pager: standaardtoggle niet gevonden')
          text = text.replace(old, new, 1)

          old = """  if(e.currentTarget.dataset.action === 'minus') count--;
  if(e.currentTarget.dataset.action === 'plus') count++;

  fifoFlow.counts[groupKey] = Math.max(min, Math.min(max, count));
"""
          new = """  if(e.currentTarget.dataset.action === 'minus') count--;
  if(e.currentTarget.dataset.action === 'plus'){
    if(fifoConfiguredTotal() >= FIFO_MAX_PRODUCTS) return;
    count++;
  }

  fifoFlow.counts[groupKey] = Math.max(min, Math.min(max, count));
"""
          if old not in text:
              raise SystemExit('pager: count handler niet gevonden')
          text = text.replace(old, new, 1)

          old = """  const removedCompleted = fifoCountCompletedThatWouldBeLost();
"""
          new = """  const configuredTotal = fifoConfiguredTotal();
  if(configuredTotal > FIFO_MAX_PRODUCTS){
    alert(`Kies maximaal ${FIFO_MAX_PRODUCTS} producten per controle. Verlaag eerst één of meer aantallen.`);
    return;
  }

  const removedCompleted = fifoCountCompletedThatWouldBeLost();
"""
          if old not in text:
              raise SystemExit('pager: startvalidatie invoegpunt niet gevonden')
          text = text.replace(old, new, 1)

          # Bewaar aangepaste aantallen wanneer standaard tijdelijk wordt aangezet.
          old = """  if(fifoFlow.useStandardCounts){
    fifoFlow.counts = fifoMinimumCounts();
  }

  if(!fifoReconcileSelectionToSettings()) return;
"""
          if old not in text:
              raise SystemExit('pager: standaard-reset bij start niet gevonden')
          text = text.replace(old, "  if(!fifoReconcileSelectionToSettings()) return;\n", 1)

          # Niet-gevulde groepen krijgen echt 0 productregels in de huidige selectie.
          old = """    const desired = fifoFlow.useStandardCounts ? rule.count : Math.max(rule.count, Number(fifoFlow.counts[groupKey]) || rule.count);
    let groupItems = fifoSelectionItemsForGroup(groupKey);
"""
          new = """    const desired = fifoFlow.pendingNotFilled[groupKey]
