}
"""
          helper = """

function activeSelectionForLog(){
  if(typeof fifoActiveItems === 'function') return fifoActiveItems();
  return selection.filter(item => !isItemNotFilledByToggle(item));
}
"""
          if helper.strip() not in text:
              if insert_after not in text:
                  raise SystemExit('forms: helper invoegpunt niet gevonden')
              text = text.replace(insert_after, insert_after + helper, 1)

          text = text.replace(
              "  const items = selection.filter(p => p.Afdeling === afdeling);",
