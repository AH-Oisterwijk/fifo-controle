name: Apply Vlees Vega beta grouping

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/apply-vlees-vega-beta.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Combine Vlees and Vega in the webapp
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Patroon niet gevonden in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Dagselectie: Vlees + Vega worden één gewogen pool van 2 producten.
          replace_once(
              'js/data.js',
              "  {subafdeling:'Vlees', afdeling:'Vlees/Vis/Kip/Vega', count:1},\n  {subafdeling:'Kip', afdeling:'Vlees/Vis/Kip/Vega', count:1},\n  {subafdeling:'Vega', afdeling:'Vlees/Vis/Kip/Vega', count:1},",
              "  {subafdeling:'Vlees/Vega', afdeling:'Vlees/Vis/Kip/Vega', count:2},\n  {subafdeling:'Kip', afdeling:'Vlees/Vis/Kip/Vega', count:1},"
          )

          # 2) Gevuld/niet gevuld: één Vlees/Vega-toggle, CSV-subafdelingen blijven apart.
          replace_once(
              'js/state.js',
              "  'Vlees/Vis/Kip/Vega': ['Vlees','Vis','Kip','Vega'],",
              "  'Vlees/Vis/Kip/Vega': ['Vlees/Vega','Vis','Kip'],"
          )

          replace_once(
              'js/state.js',
              "function itemFillGroupKey(item){\n  const keys = fillGroupKeysForDepartment(item.Afdeling);\n  const match = keys.find(key => norm(key) === norm(item.Subafdeling));\n  return match || item.Afdeling;\n}",
              "function selectionGroupForItem(item){\n  const explicit = String(item && item.Selectiegroep || '').trim();\n  if(explicit) return explicit;\n\n  const subafdeling = String(item && item.Subafdeling || '').trim();\n  if(['Vlees','Vega'].some(key => norm(key) === norm(subafdeling))) return 'Vlees/Vega';\n  return subafdeling || String(item && item.Afdeling || '').trim();\n}\n\nfunction itemFillGroupKey(item){\n  const keys = fillGroupKeysForDepartment(item.Afdeling);\n  const selectionGroup = selectionGroupForItem(item);\n  const match = keys.find(key => norm(key) === norm(selectionGroup));\n  return match || item.Afdeling;\n}"
          )

          replace_once(
              'js/state.js',
              "  const vleesState = departmentStates['Vlees/Vis/Kip/Vega'];\n  if(vleesState === 'Niet gevuld vandaag'){\n    ['Vlees','Vis','Kip','Vega'].forEach(key => departmentStates[key] = 'Niet gevuld vandaag');\n  }",
              "  const vleesState = departmentStates['Vlees/Vis/Kip/Vega'];\n  if(vleesState === 'Niet gevuld vandaag'){\n    ['Vlees/Vega','Vis','Kip'].forEach(key => departmentStates[key] = 'Niet gevuld vandaag');\n  }\n\n  if(!departmentStates['Vlees/Vega']){\n    const oudVlees = departmentStates['Vlees'];\n    const oudVega = departmentStates['Vega'];\n    departmentStates['Vlees/Vega'] =\n      oudVlees === 'Niet gevuld vandaag' && oudVega === 'Niet gevuld vandaag'\n        ? 'Niet gevuld vandaag'\n        : 'Gevuld';\n  }\n  delete departmentStates['Vlees'];\n  delete departmentStates['Vega'];"
          )

          replace_once(
              'js/state.js',
              "    'Vlees':'Gevuld',\n    'Vis':'Gevuld',\n    'Kip':'Gevuld',\n    'Vega':'Gevuld',",
              "    'Vlees/Vega':'Gevuld',\n    'Vis':'Gevuld',\n    'Kip':'Gevuld',"
          )

          # Bestaande localStorage-selecties van dezelfde productversie migreren zonder reset.
          replace_once(
              'js/state.js',
              "function validateCurrentPools(){",
              "function migrateSelectionGroups(){\n  selection.forEach(item => {\n    if(['Vlees','Vega'].some(key => norm(key) === norm(item.Subafdeling))){\n      item.Selectiegroep = 'Vlees/Vega';\n    }\n  });\n}\n\nfunction sourceSubdepartmentsForSelectionGroup(groupKey){\n  if(norm(groupKey) === norm('Vlees/Vega')) return ['Vlees','Vega'];\n  return [groupKey];\n}\n\nfunction productsForSelectionGroup(groupKey){\n  const sources = sourceSubdepartmentsForSelectionGroup(groupKey).map(norm);\n  return products.filter(p => p.Actief !== false && sources.includes(norm(p.Subafdeling)));\n}\n\nfunction validateCurrentPools(){"
          )

          replace_once(
              'js/state.js',
              "    validateCurrentPools();",
              "    migrateSelectionGroups();\n    validateCurrentPools();"
          )

          # Twee exacte pool-filters: validatie + nieuwe dagelijkse selectie.
          state_path = Path('js/state.js')
          text = state_path.read_text(encoding='utf-8')
          old_pool = "const pool = products.filter(p=>p.Actief !== false && norm(p.Subafdeling)===norm(rule.subafdeling));"
          if text.count(old_pool) != 2:
              raise SystemExit(f'Verwachtte 2 exacte poolfilters, vond {text.count(old_pool)}')
          text = text.replace(old_pool, "const pool = productsForSelectionGroup(rule.subafdeling);")
          state_path.write_text(text, encoding='utf-8')

          replace_once(
              'js/state.js',
              "      output.push({Id:volgorde,DagKey:dayKey,Nasa:p.Nasa,Productnaam:p.Productnaam,Afdeling:rule.afdeling,Subafdeling:rule.subafdeling,Volgorde:volgorde++,Status:'Open',Shiftleider:'',TijdGecheckt:''});",
              "      output.push({Id:volgorde,DagKey:dayKey,Nasa:p.Nasa,Productnaam:p.Productnaam,Afdeling:rule.afdeling,Subafdeling:p.Subafdeling,Selectiegroep:rule.subafdeling,Volgorde:volgorde++,Status:'Open',Shiftleider:'',TijdGecheckt:''});"
          )

          replace_once(
              'js/state.js',
              "  let basePool = activeProductsForSubafdeling(item.Subafdeling)\n    .filter(p => p.Afdeling === item.Afdeling && p.Nasa !== item.Nasa && !usedInAfdeling.has(String(p.Nasa)));",
              "  let basePool = productsForSelectionGroup(selectionGroupForItem(item))\n    .filter(p => p.Afdeling === item.Afdeling && p.Nasa !== item.Nasa && !usedInAfdeling.has(String(p.Nasa)));"
          )

          # UI toont beide slots als Vlees/Vega, ongeacht of het gekozen product uit Vlees of Vega komt.
          replace_once(
              'js/ui.js',
              "    <div class=\"fifo-card-top\"><span class=\"fifo-sub\">${esc(item.Subafdeling)}</span><span class=\"fifo-status-pill\">${esc(statusText)}</span></div>",
              "    <div class=\"fifo-card-top\"><span class=\"fifo-sub\">${esc(selectionGroupForItem(item))}</span><span class=\"fifo-status-pill\">${esc(statusText)}</span></div>"
          )

          # README bijwerken; products.csv zelf blijft bewust ongewijzigd.
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace("Vis                    1\nVlees                  1\nKip                    1\nVega                   1", "Vis                    1\nVlees/Vega             2\nKip                    1")
          text = text.replace(
              "Vlees, Vis, Kip en Vega kunnen afzonderlijk als gevuld/niet gevuld worden gemarkeerd. Hetzelfde geldt voor Maaltijden en Sappen en voor Zuivel en Boter.",
              "Vlees en Vega vormen in de webapp samen de selectiegroep `Vlees/Vega` met twee controles per dag. Vis en Kip blijven aparte groepen. In `data/products.csv` blijven `Vlees` en `Vega` bewust als afzonderlijke subafdelingen opgeslagen, zodat die scheiding later eenvoudig kan worden teruggebracht. Maaltijden/Sappen en Zuivel/Boter blijven eveneens als afzonderlijke gevuld/niet-gevuld-groepen werken."
          )
          text = text.replace(
              "- `Subafdeling`: selectie- en gevuld/niet-gevuld-groep.",
              "- `Subafdeling`: oorspronkelijke productsubafdeling. `Vlees` en `Vega` blijven hier bewust apart; de webapp combineert ze tijdens selectie tot `Vlees/Vega`."
          )
          readme.write_text(text, encoding='utf-8')

          # Validatie: CSV mag niet zijn gewijzigd en de nieuwe logica moet aanwezig zijn.
          data = Path('js/data.js').read_text(encoding='utf-8')
          state = Path('js/state.js').read_text(encoding='utf-8')
          ui = Path('js/ui.js').read_text(encoding='utf-8')
          if "{subafdeling:'Vlees/Vega', afdeling:'Vlees/Vis/Kip/Vega', count:2}" not in data:
              raise SystemExit('Vlees/Vega selectie-regel ontbreekt')
          if "'Vlees/Vis/Kip/Vega': ['Vlees/Vega','Vis','Kip']" not in state:
              raise SystemExit('Vlees/Vega fill-groep ontbreekt')
          if "productsForSelectionGroup(selectionGroupForItem(item))" not in state:
              raise SystemExit('Random replacement gebruikt niet de gecombineerde pool')
          if "selectionGroupForItem(item)" not in ui:
              raise SystemExit('UI-label gebruikt niet de gecombineerde selectiegroep')
          PY

      - name: Ensure products CSV was not changed
        run: git diff --exit-code -- data/products.csv

      - name: Commit beta grouping
        shell: bash
        run: |
          git config user.name 'AH-Oisterwijk'
          git config user.email 'Bob.Schegget@ah.nl'
          git add js/data.js js/state.js js/ui.js README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Combine Vlees and Vega selection group on beta'
          git push origin beta
