name: One-shot compact Forms payload migration
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/one-shot-compact-forms.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Compact control payload
        shell: bash
        run: echo ' ' | tr -d ' ' | base64 -d > /tmp/patch_forms.py && python3 /tmp/patch_forms.py && git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add js/forms.js && git diff --cached --quiet || (git commit -m 'Compact FIFO Forms payload for safer URLs' && git push origin HEAD:beta)
