<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FIFO Controle</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/pager.css">
  <script src="config.js"></script>
</head>
<body>
  <div class="fifo-app fifo-flow-app" id="controlPage">
    <header class="fifo-flow-setup-header" id="setupHeader">
      <div>
        <h1>FIFO Controle</h1>
        <p id="dateLabel"></p>
      </div>
    </header>

    <section class="fifo-flow-leader" id="setupLeaderCard">
      <label for="leader">Naam shiftleider / manager</label>
      <select id="leader">
        <option value="">Shiftleiders worden geladen...</option>
      </select>
    </section>

    <header class="fifo-control-topbar fifo-hidden" id="controlTopbar">
      <button type="button" class="fifo-top-action" id="fifoSettingsBtn">← Instellingen</button>
      <div class="fifo-compact-progress">
        <div class="fifo-compact-progress-line">
          <span>Voortgang</span><strong id="progressText">0/0</strong>
        </div>
        <div class="fifo-progress"><div id="progressBar"></div></div>
      </div>
      <button type="button" class="fifo-top-action fifo-top-reset" id="fifoResetBtn">Reset</button>
    </header>

    <input id="dateInput" type="hidden">
    <div id="stats" class="fifo-hidden"></div>
    <main id="content" class="fifo-flow-content"></main>
  </div>

  <div class="fifo-submit-page fifo-hidden" id="submitPage">
    <section class="fifo-card">
      <h1>FIFO Controle</h1>
      <p>
        Je bent teruggekomen vanuit Microsoft Forms. Controleer of de controle daar is verzonden.
        Wil je opnieuw naar Microsoft Forms, klik dan op <strong>Naar Microsoft Forms om op te slaan</strong>.
        Wil je nog iets aanpassen, klik dan op <strong>Terug</strong>.
      </p>
      <div id="submitError" class="fifo-submit-error fifo-hidden"></div>
      <div id="submitSummary" class="fifo-submit-summary"></div>
      <div class="fifo-submit-actions">
        <button class="toolbtn primary" id="continueFormsBtn">Naar Microsoft Forms om op te slaan</button>
        <button class="toolbtn secondary" id="backToControlBtn">Terug</button>
      </div>
    </section>
  </div>

<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/qr.js"></script>
<script src="js/forms.js"></script>
<script src="js/ui.js"></script>
<script src="js/pager.js"></script>
<script src="js/app.js"></script>
</body>
</html>
