<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FIFO Controle</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/pager.css">
  <script src="config.js"></script>
</head>
<body>
  <div class="fifo-app" id="controlPage">
    <section class="fifo-header">
      <div>
        <h1>FIFO Controle</h1>
        <p id="dateLabel"></p>
      </div>
      <div class="fifo-header-actions"><button class="fifo-refresh" id="refreshBtn" title="Ververs">↻</button></div>
    </section>
    <section class="fifo-card fifo-control">
      <label for="leader">Shiftleider / Manager</label>
      <select id="leader">
        <option value="">Shiftleiders worden geladen...</option>
      </select>
    </section>

    <input id="dateInput" type="hidden">

    <section class="fifo-card">
      <div class="fifo-progress-row">
        <strong>Voortgang</strong>
        <span id="progressText">0/17</span>
      </div>
      <div class="fifo-progress"><div id="progressBar"></div></div>
      <div class="fifo-mini-stats" id="stats"></div>
    </section>
    <section class="fifo-card fifo-submit-card">
      <button class="toolbtn primary formsLogBtn">Naar Microsoft Forms om op te slaan</button>
      <button class="fifo-reset resetBtn" title="Reset controle">Reset controle</button>
    </section>

    <section id="content"></section>

    <section class="fifo-card fifo-bottom-submit">
      <button class="toolbtn primary formsLogBtn">Naar Microsoft Forms om op te slaan</button>
      <button class="fifo-reset resetBtn" title="Reset controle">Reset controle</button>
    </section>
  </div>

  <div class="fifo-submit-page fifo-hidden" id="submitPage">
    <section class="fifo-card">
      <h1>FIFO Controle</h1>
      <p>
        Je bent teruggekomen vanuit Microsoft Forms. Controleer of de controle daar is verzonden.
        Wil je opnieuw naar Microsoft Forms, klik dan op <strong>Naar Microsoft Forms om op te slaan</strong>.
        Wil je nog iets aanpassen, klik dan op <strong>Terug</strong>.
      </p>
      <div id="submitError" class="fifo-submit-error fifo-hidden"></div>
      <div id="submitSummary" class="fifo-submit-summary"></div>
      <div class="fifo-submit-actions">
        <button class="toolbtn primary" id="continueFormsBtn">Naar Microsoft Forms om op te slaan</button>
        <button class="toolbtn secondary" id="backToControlBtn">Terug</button>
      </div>
    </section>
  </div>

<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/qr.js"></script>
<script src="js/forms.js"></script>
<script src="js/ui.js"></script>
<script src="js/pager.js"></script>
<script src="js/app.js"></script>
</body>
</html>
